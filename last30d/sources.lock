      "note": "2026-07-20 re-pull (baseline 2026-07-09 at ae8c32327f86): xai_x.py + log.py re-pulled at 39cca461aab5 (fixes AttributeError on the xAI error path — `http.DEBUG` → `log.is_debug()`); reddit_listing.py re-pulled at 298310ca34a5 (backward-compatible: timeframe param, r/all, discovery helpers). http.py DELIBERATELY HELD at the ae8c32327f86 baseline — upstream's http.py is now coupled to a health.py module / fixture tooling we don't vendor; before re-pulling any leaf later, confirm it doesn't use the new http API. On re-sync watch the shreddit /svc endpoints (reddit_listing/reddit_shreddit) and the xAI x_search contract (xai_x) — those rot. Keep the verbatim-copy + own-orchestrator split; re-pull, don't hand-merge. 2026-09-17 re-pull (checked against HEAD 4ee76ab6ef63): reddit_shreddit.py re-pulled at b28775e45a71 (drops bot authors such as AutoModerator before ranking — reddit_lane shows only top_comments[0]; enrich limits 3/5/8→4/8/12, MAX_COMMENTS 10→12; uses only http.reddit_keyless_get_text, which we have); guarded by test_shreddit_drops_bot_comments_before_ranking (fails on the old file). reddit_rss.py (upstream also touched 57f8d2c 07-30 and b28775e45a71) + reddit_listing.py DELIBERATELY HELD: the new versions call http.reddit_keyless_get_text_retry_429 / reddit_keyless_wait_allowance / submit_with_context and reddit_listing imports reddit_arctic — none exist here, so a verbatim re-pull crashes at fetch time and the offline parser tests would NOT catch it; their parsers (_parse_feed, parse_cards) are unchanged. GUARD ADDED: tests/test_vendored_symbols_resolve.py walks every vendored file's AST and asserts each sibling-module attribute it reads exists locally — it fails offline on exactly this case (verified by dropping in upstream's newer reddit_rss.py), which the parser tests could not catch. http.py still held; upstream a46c419 strips credential headers on cross-host redirects (#1062) — candidate for an original guard, not a re-pull. 2026-10-05 re