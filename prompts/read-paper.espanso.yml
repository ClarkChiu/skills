# Espanso match file — 讀論文三段式 prompt
# 安裝：複製（或 symlink）到 Espanso 的 match 目錄後，espanso restart
#   Windows : %APPDATA%\espanso\match\
#   Linux   : ~/.config/espanso/match/
#   macOS   : ~/Library/Application Support/espanso/match/
# 用法：在任何輸入框打觸發字即原地展開。觸發字可自行改。

matches:
  # ① 建構：心智圖筆記
  - trigger: ":mind"
    replace: |
      # 角色
      你是一位擅長拆解學術論文的研究助理，習慣用 Markdown 心智圖（可直接餵給 Markmap／XMind）做結構化筆記。

      # 任務
      閱讀我提供的這份檔案（論文／報告／PDF），整理成一份 Markdown 心智圖筆記。

      # 結構規則
      1. 第一層（# 標題）：以文件原本的章節／目錄結構為骨幹（例：摘要、緒論、相關研究、方法、實驗、結果、討論、結論）。
      2. 往下逐層展開（##、###、-），依序帶出：
         - 🎯 核心問題與研究動機
         - 🧩 重要知識點與關鍵概念
         - 🔬 研究方法與實驗設計
         - 📊 實驗數據與量化結果（保留具體數字、單位、比較基準）
         - 💡 數據背後的洞察與作者主張
         - ✅ 結論與貢獻
         - ⚠️ 限制與未來工作
      3. 每個節點用精煉短句，不要整段照抄；專有名詞、公式、模型名稱保留原文。

      # 輸出格式
      - 全程階層式 Markdown 標題與項目符號，並在 CODE BLOCK 中輸出（方便複製）。
      - 善用表情符號標示節點類型。
      - 台灣繁體中文，中英文之間加空格（盤古之白）。
      - 只根據檔案內容整理；找不到的段落標註「（原文未提供）」，絕不杜撰數據。

  # ② 追問：10 組最關鍵的概念性問題
  - trigger: ":ask10"
    replace: |
      基於上面這份心智圖筆記，請給我 10 組「最關鍵的概念性問題」。

      要求：
      1. 概念性，不是事實複述——聚焦在「機制為什麼成立、背後的關鍵假設、設計取捨、適用邊界與失效情境、與既有做法的本質差異」，而非「第幾頁寫了什麼」。
      2. 依「對理解全篇的重要性」由高到低排序；必要時可分組（理解 / 批判 / 延伸）。
      3. 每一題附一句話說明「為什麼這題關鍵、它戳中論文的哪個要害」。
      4. 先只列問題，等我逐題或挑題與你討論時，你再以原文為依據展開作答；原文沒交代的，明說「論文未交代」。
      5. 台灣繁體中文，中英文之間加空格；模型名稱、術語保留原文。

  # ③ 整合：把全部討論回填進筆記
  - trigger: ":merge"
    replace: |
      請以你最初的那份心智圖筆記為基礎，把我們後續討論出來的內容全部整併進去，包括：
      - 你針對前述問題所做的延伸解說（例如某個核心概念的原理說明）；
      - 我補充的素材描述（例如資料／樣本結構、圖表或截圖的說明）；
      - 其他在對話中釐清的重點。

      整併規則：
      1. 新內容掛回它所屬的原節點底下，維持原本的章節骨幹，不要另起爐灶。
      2. 我們對內容的疑點、困惑、待查證之處，用「引用／註解」的方式就地標註，與正文視覺分層、可追溯。建議：
         - 困惑與待釐清 → 用引用區塊：「> ❓ 疑問：……」
         - 補充說明或出處 → 用註腳：「[^1]」
         - 不確定、需回去查原文 → 用註解：「<!-- 待查證：…… -->」
      3. 整體要「人類易讀易懂」：節點精煉、層次清楚、善用表情符號。
      4. 以 Markdown 心智圖的形式，在 CODE BLOCK 中輸出整份完整筆記（方便一次複製、直接餵 Markmap）。
      5. 台灣繁體中文，中英文之間加空格；專有名詞、術語、模型名稱保留原文。
