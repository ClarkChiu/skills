      "note": "2026-10-05 bump (was cae49bb03a2a): ~40 guarded mainland→Taiwan terms. ADOPTED the unambiguous ones the frozen engine gets wrong into vocab_fixes: 請求頭(部)→請求標頭, 虛擬現實→虛擬實境, 置信區間→信賴區間, 置信水平→信賴水準, 協方差→共變異數, 正態分佈/布 and 常態分佈→常態分布 (MOE form; enabled by the same-day switch of the Simplified-line detector to per-character Simplified-only lookup, which also stops 秘魯/布/干 lines from being re-converted), 最大似然估計→最大概似估計, 備擇假設→對立假設, 顯著性水平→顯著水準, 馬爾可夫/科夫→馬可夫, 艾滋病→愛滋病 (keyed on 病: bare 艾滋 corrupts 方興未艾滋長), 腦卒中→腦中風, 靶向治療→標靶治療, 論文答辯→論文口試, 似然函式/數→概似函數. Context-dependent ones (回歸, 身份, 篩查, 黃油, 按揭, 用人單位, 零假設, 數學期望) recorded in glossary.md as not word-replaceable. Previous: 2026-09-17 bump (was 5d242bcefd3c), user-approved: ~170 commits, mostly engineering (RMCP 3 SDK, hooks, HTML lang scoping). Upstream added a post-OpenCC residual rule pack + 18 map/military/networking terms. ADOPTED as our own data, not their architecture: 子網掩碼→子網路遮罩 and 掩碼→遮罩 into data/defaults.json (safe, output holds no key), 群播 for multicast but ONLY as full networking compounds in user-dictionary.json (bare 組播 collides with 這組播放清單 / 分組播出). NOT adopted mechanically — recorded in references/glossary.md instead: 丟包 (collides with 丟包袱), 報文, 匹配. Upstream gates the ambiguous ones with context clues; this pipeline has no word boundaries, so ambiguity belongs in the human-facing glossary. Previous: 2026-08-04 bump (was 2e0f4e4912a8): two commits — an E2E test for invalid request-shaped messages and its merge. No rule/detector change. No action. 2026-07-20 bump (was df4762639f8b): baseline refresh per 2026-07-20 upstream-drift review; no rule/detector change adopted for this pipeline. No action. 2026-07-06 bump (was fbc0fa8347df): only nix-shell docs + a merge, no rule/detector change. No action. 2026-06-28 bump (was 409132225db1). Recent commits: 'exclude ambiguous chars from single-char fallback', narrow 聯繫 cross-strait tagging, 函數/函式 split, math/linear-algebra vocab. The 'single-char fallback should exclude 