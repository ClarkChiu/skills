mechanical layer has no word boundaries and 「報表上的數字/人文科系」 gets eaten (live-verified), so it is recorded in references/glossary.md as 不可逐字替換 with a regression test pinning its absence from defaults.json. normalize.py now applies replacements longest-key-first so a short key can't eat a longer one (快快閃記憶體儲 ⊂ 快快閃記憶體儲器); 4 regression tests added, 46/46 pass. The new --ambiguities one-to-many reporting mode is C++-only and unreachable from the frozen port — noted, not adopted. 2026-07-20 bump (was 6a49a351b4be / ver.1.4.0): ver.1.4.1 reviewed; frozen-port decision HELD, no engine switch. Verified gaps in the frozen engine patched POST-conversion via user-dictionary.json instead: 覆盤→復盤, 這周→這週, 那周→那週, 周線→週線 (substring-collision checked; outputs don't contain sources, so idempotent). 2026-07-06 bump (was b9e757b6de2c / ver.1.3.1): ver.1.4.0 is a C++ ABI/SOVERSION bump + .ocd dict fast-path; TWPhrases.txt (the Taiwan-phrase layer) UNCHANGED — only a 芯片 segmentation fix + minor STPhrases. LIVE-VERIFIED that frozen opencc-python-reimplemented==0.1.7 already yields 芯片→晶片 / 內存芯片→記憶體晶片 correctly, so 1.4.0's fix is a no-op for us. Frozen-port decision HELD, no engine switch. 2026-06-28 bump (was c208e2780e5b, still ver.1.3.1 — intra-release commits). EMPIRICAL re-validation of the standing decision: ran A/B s2twp on 23 terms, frozen opencc-python-reimplemented==0.1.7 vs maintained C++ `opencc` 1.3.x. Only 2/23 differed and they CANCEL OUT — C++ better on 以太网→乙太網路 (Taiwan std, on-domain) but WORSE on 拉链→拉鏈 (frozen gives 拉鍊, MOE-preferred). The much-touted 云计算→雲端計算 is already correct in BOTH (not a differentiator; the earlier changelog-based claim was wrong). Net quality = wash; switching costs reproducibility + a native build. DECISION HELD: stay on frozen port, no engine switch, no code change. The one on-domain gap (乙太網→乙太網路) can't be patched via user-dictionary.json replacements either: that layer is post-OpenCC substring with no word boundary, so 乙太網→乙太網路 would double-apply to existing 乙太網路 (→乙太網路路, the documented substring-collision trap). Would need a context-aware regex rule — not worth it for one term. Revisit only if accuracy genuinely demands a maintained binding. 2026-06-17 bump (was 47cccca4f826): first review of 1.3.x."
